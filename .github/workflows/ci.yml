name: ci

on:
  push:
    branches:
      - main
      - "phase-*"
  pull_request:

jobs:
  test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[tests,lint]

      - name: Run pytest suite and CLI smoke checks
        run: |
          pytest -v
          python -m demof2py.cli ode --steps 40 --zeta 0.15
          python -m demof2py.cli poisson -n 11 --source dipole
          python -m demof2py.cli eigen --preset spd_stiffness --iterations 50
          python -m demof2py.cli tridiag -n 15 --bc catenary
          python -m demof2py.cli blackscholes -n 41 --sigma 0.20
          python -m demof2py.cli spectral -n 64 --freq1 5.0 --freq2 14.0
          python -m demof2py.cli montecarlo --paths 10000 --sigma 0.25
          python -m demof2py.cli autodiff -x -1.2 -y 1.0
          python -m demof2py.cli sparse-csr -n 64 --bandwidth 1
          python -m demof2py.cli report-md
          python -m demof2py.cli report-sarif
          python -m demof2py.cli modernize --preset badcomment_f
          python -m demof2py.cli scaffold --preset numerics_f90
          python -m demof2py.cli audit --compile-check

  fortran-native-meson:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran, meson, and ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran meson ninja-build
      - name: Build and test native Fortran 2008 targets
        run: |
          meson setup builddir
          meson compile -C builddir
          meson test -C builddir --verbose
          ./builddir/fortran_workbench --all
          ./builddir/fortran_workbench --blackscholes
          ./builddir/fortran_workbench --spectral
          ./builddir/fortran_workbench --montecarlo
          ./builddir/fortran_workbench --autodiff
          ./builddir/fortran_workbench --sparse




