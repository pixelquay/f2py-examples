[metadata]
name = demof2py
version = 7.0.0
author = Michael Hirsch, Ph.D.
author_email = scivision@users.noreply.github.com
description = Production Fortran-Python f2py numerical kernel & diagnostic workbench
url = https://github.com/scivision/f2py-examples
keywords =
  fortran
  f2py
  numerical-computing
  ieee754
classifiers =
  Development Status :: 5 - Production/Stable
  Environment :: Console
  Environment :: Web Environment
  Intended Audience :: Science/Research
  Intended Audience :: Developers
  Operating System :: OS Independent
  Programming Language :: Fortran
  Programming Language :: Python :: 3
license_files =
  LICENSE.txt
long_description = file: README.md
long_description_content_type = text/markdown

[options]
python_requires = >= 3.9
packages = find:
include_package_data = True
install_requires =
  numpy >= 1.20
  fastapi >= 0.100.0
  uvicorn >= 0.20.0
  pydantic >= 2.0.0

[options.extras_require]
tests =
  pytest
  httpx
lint =
  flake8
  flake8-bugbear
  flake8-builtins
  flake8-blind-except
  mypy

[options.entry_points]
console_scripts =
  f2py-workbench = demof2py.cli:main

